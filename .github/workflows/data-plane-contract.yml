name: production-data-plane
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  structural-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check production entries, dependencies, native owners and retirements
        run: python3 scripts/check_data_plane_contract.py .
      - name: Exercise rejected boundary mutations
        run: python3 -m unittest discover -s tests -p 'test_data_plane_contract.py'
