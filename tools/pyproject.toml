[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emuflow-tools"
version = "0.1.0"
description = "Optional EmuFlow research and dataset preparation tools"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["emuflow>=0.1.0"]

[project.scripts]
emuflow-tools = "emuflow_tools.cli:main"
emuflow-ppro-calibration = "emuflow_tools.ppro_calibration_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["emuflow_tools*"]
