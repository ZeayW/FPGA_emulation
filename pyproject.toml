[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emuflow"
version = "0.1.0"
description = "Open, source-complete multi-FPGA emulation flow"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "EmuFlow contributors"}
]
dependencies = []

[project.scripts]
emuflow = "emuflow.flow.cli:main"

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.setuptools.package-data]
emuflow = ["data/schema/*.sql", "data/schema/*.tcl", "data/rapidwright/*.json", "data/partition/*.json", "data/openparf/*.json", "data/designs/*.json", "data/designs/*.v", "data/platforms/*.json", "data/io/*.json"]

[tool.setuptools.data-files]
"share/emuflow/platforms" = ["platforms/virtual/*.wires.csv"]
"share/emuflow/scripts/rapidwright" = ["scripts/rapidwright/EmuFlowRWRoute.java"]
"share/emuflow/scripts/vivado" = ["scripts/vivado/*.tcl"]
"share/emuflow/scripts/opensta" = ["scripts/opensta/*.tcl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/python", "tools", "."]
