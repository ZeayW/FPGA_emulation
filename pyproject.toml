[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emuflow"
version = "0.1.0"
description = "Open, source-complete multi-FPGA emulation flow"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "EmuFlow contributors"}
]
dependencies = []

[project.optional-dependencies]
cp-sat = ["ortools>=9.10"]

[project.scripts]
emuflow = "emuflow.cli:main"
emuflow-ppro-calibration = "emuflow.ppro_calibration_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emuflow = ["data/rapidwright/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
